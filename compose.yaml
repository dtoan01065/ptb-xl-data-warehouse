services:
  postgres:
    image: postgres:16
    container_name: ptbxl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Thieu POSTGRES_DB trong .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Thieu POSTGRES_USER trong .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD trong .env}"
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ptbxl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ptbxl_postgres_data: